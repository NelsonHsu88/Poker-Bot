[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerbot"
version = "0.1.0"
description = "Poker AI playground: Monte Carlo equity, a 5-player bot simulator, a CFR push/fold solver, and charts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "numba>=0.59", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pokerbot = "pokerbot.cli:main"

[tool.setuptools]
packages = ["pokerbot"]

[tool.setuptools.package-data]
pokerbot = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
